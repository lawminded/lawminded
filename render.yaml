# Render Blueprint — defines the Law Minded web service.
# On Render: New + → "Blueprint" → connect this repo → it reads this file.
services:
  - type: web
    name: lawminded
    runtime: python
    plan: free            # start free; change to "starter" ($7/mo) for always-on + a persistent disk
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PRODUCTION
        value: "true"              # enables HTTPS enforcement, HSTS, and Secure cookies
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong random key
      - key: ADMIN_PASSWORD
        sync: false                # you set this in the dashboard (hidden)
      # ── Google AdSense (already yours) ──
      - key: ADSENSE_CLIENT
        value: ca-pub-5076002954680667
      - key: ADSENSE_SLOT_TOP
        value: "8385529112"
      - key: ADSENSE_SLOT_MID
        value: "8385529112"
      - key: ADSENSE_SLOT_BOTTOM
        value: "8776369792"
      - key: ADSENSE_SLOT_ARTICLE_TOP
        value: "2869436994"
      - key: ADSENSE_SLOT_ARTICLE_BOTTOM
        value: "2869436994"
      # ── Gmail (fill in the dashboard to enable contact form + newsletter emails) ──
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CONTACT_RECEIVER
        sync: false

    # ── PERSISTENT DATA (uncomment after switching plan to "starter") ──
    # A disk keeps your admin-added articles/subscribers across deploys.
    # disk:
    #   name: lawminded-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # And add this env var so the database lives on the disk:
    #   - key: DATABASE_PATH
    #     value: /var/data/lawminded.db
