# nginx reverse proxy for Law Minded. Installed by deploy/setup.sh (which fills in
# __APP_DIR__). certbot later edits this file to add the HTTPS (443) block and the
# HTTP->HTTPS redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name lawminded.in www.lawminded.in lawminded.co.in www.lawminded.co.in;

    # App caps bodies at 1 MB; give nginx a little headroom before it 413s.
    client_max_body_size 2M;

    # Abuse blocklist. 80.94.95.0/24 ran the Aug 2026 contact-form spam (3,300
    # messages in nine days from .173 and .202) and probed for exposed .env
    # files from the same range. Kept in the repo so a setup.sh re-run does not
    # silently drop it. The app-side defences in app.py are the real fix — this
    # just stops a known-bad range cheaply, before it reaches Python.
    include /etc/nginx/lawminded-blocklist.conf;

    # Serve static assets straight from disk (faster, skips Python).
    location /static/ {
        alias __APP_DIR__/static/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
