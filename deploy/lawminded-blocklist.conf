# Law Minded — nginx abuse blocklist.
# Deployed to /etc/nginx/lawminded-blocklist.conf and included by the server
# block in deploy/nginx.conf.
#
# To add a range later:  echo "deny 1.2.3.0/24;" | sudo tee -a /etc/nginx/lawminded-blocklist.conf
# then:                  sudo nginx -t && sudo systemctl reload nginx
# Always run `nginx -t` before reloading — a syntax error here takes the site down.

# Aug 2026 contact-form spam campaign ("RobertMom"): 3,305 of 3,308 junk
# messages came from 80.94.95.173 and 80.94.95.202. The same range also
# requested /laravel/.env, /twilio/.env.php and similar, i.e. scanning for
# leaked credentials — so the whole /24 goes.
deny 80.94.95.0/24;
