# Shared proxy directives for the Law Minded app.
# Installed to /etc/nginx/snippets/lawminded-proxy.conf by deploy/setup.sh, so the
# several location blocks that proxy to gunicorn cannot drift apart.
proxy_pass http://127.0.0.1:8000;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# nginx did not previously set these two, so whatever the client sent was passed
# straight through to Flask. With ProxyFix trusting them, a request carrying
# `X-Forwarded-Host: evil.tld` could rewrite request.host and poison any absolute
# URL the app generated. Pin both to the real values.
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_redirect off;
