# Law Minded security defaults. Installed to
# /etc/nginx/conf.d/00-lawminded-security.conf, which nginx loads before
# sites-enabled, so the limit_req zones below are available to the site config.

# Don't advertise the nginx version in headers or error pages.
server_tokens off;

# ── Rate-limit zones ──────────────────────────────────────────────────────
# Sized for a ~1 GB VM: 10m holds roughly 160k IPs.
# Generous on normal browsing, tight on the endpoints worth attacking.
limit_req_zone $binary_remote_addr zone=lm_general:10m rate=30r/s;   # whole site
limit_req_zone $binary_remote_addr zone=lm_login:10m   rate=10r/m;   # /admin/login
limit_req_zone $binary_remote_addr zone=lm_forms:10m   rate=20r/m;   # spare, unused
limit_conn_zone $binary_remote_addr zone=lm_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# ── Catch-all: anything not addressed to a real Law Minded hostname ───────
# Before this, https://<server-ip>/ served the whole site, which let scanners
# and bots reach the app without ever resolving the domain.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # nginx >= 1.19.4: drop unknown-SNI handshakes
}
